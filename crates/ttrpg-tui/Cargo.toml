[package]
name = "ttrpg-tui"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
ratatui = "0.30.2"
textwrap = "0.16.4"
ttrpg-core = { version = "0.1.0", path = "../ttrpg-core" }
unicode-width = "0.2.2"

[dev-dependencies]
serde_json = { version = "1.0.154", features = ["preserve_order"] }
tempfile = "3.27.0"
